services:
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      - MQTT_SERVICE=gateway
    depends_on:
      - auth
      - agents

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    ports:
      - "127.0.0.1:5010:5010"
    env_file:
      - ./.env

  friends:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    command: ["uvicorn", "apps.auth.friends.main:app", "--host", "0.0.0.0", "--port", "5020"]
    ports:
      - "127.0.0.1:5020:5020"
    env_file:
      - ./.env

  agents:
    build:
      context: .
      dockerfile: apps/agents/Dockerfile
    ports:
      - "127.0.0.1:5030:5030"
    env_file:
      - ./.env

  virtual_engine:
    build:
      context: .
      dockerfile: apps/virtual_engine/Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - ./.env
    environment:
      - MQTT_SERVICE=virtual_engine
    depends_on:
      - auth

  physical_engine:
    build:
      context: .
      dockerfile: apps/physical_engine/Dockerfile
    gpus: all
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - ./.env
    environment:
      - MQTT_SERVICE=physical_engine
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - SUECA_YOLO_DEVICE=cuda:0
    depends_on:
      - auth

  cloudflare:
    build:
      context: .
      dockerfile: apps/cloudflare/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - MQTT_SERVICE=cloudflare
    depends_on:
      - gateway
      - emqx

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"

  emqx:
    image: emqx/emqx:5.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:8883:8883"
      - "127.0.0.1:18083:18083"

    environment:
      - EMQX_NAME=emqx-sueca
      - EMQX_HOST=0.0.0.0
      - EMQX_ALLOW_ANONYMOUS=false
    volumes:
      - ./apps/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./apps/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./apps/emqx/certs:/opt/emqx/etc/certs:ro


