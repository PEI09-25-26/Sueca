# Custom EMQX config for Sueca 1.4
# Goal: keep the broker configuration local to the project while enabling
# file-based authorization from `etc/acl.conf`.

node {
  name = "emqx-sueca@0.0.0.0"
  data_dir = "/opt/emqx/data"
  cookie = "emqx_cookie"
}

cluster {
  name = "emqx-sueca"
}

listeners {
  tcp {
    default {
      bind = "1883"
    }
  }

  ssl {
    default {
      bind = "8883"
    }
  }

  ws {
    default {
      bind = "0.0.0.0:8083"
      websocket {
        mqtt_path = "/mqtt"
      }
    }
  }
}

dashboard {
  listeners {
    http {
      bind = "0.0.0.0:18083"
      max_connections = 512
    }
  }
}


authorization {
  deny_action = ignore
  no_match = allow

  sources = [
    {
      type = file
      enable = true
      path = "etc/acl.conf"
    }
  ]
}

